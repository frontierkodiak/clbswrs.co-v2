url: "https://clbswrs.co"
baseurl: ""
repository: frontierkodiak/clbswrs.co-v2
lang: en
timezone: America/New_York

collections:
  stream:
    output: true
    permalink: /stream/:name/

defaults:
  - scope:
      path: ""
      type: stream
    values:
      layout: stream-entry

header_pages:
  - art.md
  - projects.md

footer: "[email](mailto:caleb@polli.ai) · [github](https://github.com/frontierkodiak) · [x](https://x.com/clbswrs) · [linkedin](https://www.linkedin.com/in/calebsowers/)"

style: light # dark (default) or light
#listen_for_clients_preferred_style: true # true or false (default)

plugins:
  - jekyll-seo-tag

strict_front_matter: true

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor
  - docs
  - tools
  - tests
